[project]
name = "ragpoc"
version = "0.1.0"
description = "Gemma 4 E2B chat + PageIndex RAG POC (M2 Air, 8GB)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
  "python-multipart>=0.0.9",
  "opendataloader-pdf>=2.2.0",
  "llama-cpp-python==0.3.34",
  # CUDA runtime DLLs required by the cu124 llama-cpp-python wheel on Windows
  # (the OS has the driver but not the CUDA Toolkit runtime libs).
  "nvidia-cuda-runtime-cu12==12.4.99",
  "nvidia-cublas-cu12==12.4.5.8",
  "nvidia-cuda-nvrtc-cu12==12.4.127",
  "nvidia-cufft-cu12==11.2.1.3",
  "nvidia-curand-cu12==10.3.5.147",
  "huggingface-hub>=0.24.0",
]

[dependency-groups]
dev = [
  "ruff>=0.4.0",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

# Prebuilt CUDA 12.4 wheels for Windows/Linux (avoid source build requiring MSVC).
# NVIDIA driver 12.8 is backward-compatible with the cu124 wheel; CUDA runtime DLLs
# are supplied via the nvidia-*-cu12 pip packages (added to dependencies below).
[[tool.uv.index]]
name = "llama-cpp-cu124"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cu124" }
