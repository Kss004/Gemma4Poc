[project]
name = "ragpoc"
version = "0.1.0"
description = "Gemma 4 E2B chat + PageIndex RAG POC (M2 Air, 8GB)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
  "python-multipart>=0.0.9",
  "opendataloader-pdf>=2.2.0",
  "llama-cpp-python>=0.3.2",
  "huggingface-hub>=0.24.0",
]

[dependency-groups]
dev = [
  "ruff>=0.4.0",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]
